name: 发布

on:
  workflow_call:
    inputs:
      tag_name:
        description: "要构建和发布的标签（例如 v0.2.0）"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要构建和发布的标签（例如 v0.2.0）"
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: tjuae-cli
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"

jobs:
  prepare-release:
    name: 准备发布元数据
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag_name }}

      - name: 从标签提取版本
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: tjuae-cli
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: tjuae-cli
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: tjuae-cli
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: tjuae-cli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: tjuae-cli.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: tjuae-cli.exe

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag_name }}

      - name: 设置 vx（从 vx.toml 安装 Rust）
        uses: loonghao/vx@v0.9.26
        with:
          setup: 'true'
          cache: 'true'

      - name: 添加交叉编译目标
        run: rustup target add ${{ matrix.target }}

      - name: 修复 MSVC 链接器（删除 Git 的 link.exe）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: 安装 cross（Linux aarch64）
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: 构建发布二进制文件
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }} -p tjuae-cli
          else
            vx cargo build --release --target ${{ matrix.target }} -p tjuae-cli
          fi

      - name: 打包二进制文件（Unix）
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          mkdir -p dist
          ARCHIVE="tjuae-cli-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "dist/${ARCHIVE}" ${{ matrix.binary_name }}
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: 打包二进制文件（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "tjuae-cli-v${env:VERSION}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "dist/${archive}" -Force
          "ARCHIVE=${archive}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 上传发布产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error

  github-release:
    name: 上传 GitHub Release 产物
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        shell: bash
        run: |
          cd artifacts
          sha256sum tjuae-cli-* > tjuae-cli-checksums.txt

      - name: 上传发布产物
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release_url="https://github.com/${REPOSITORY}/releases/tag/${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" artifacts/* --repo "${REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" artifacts/* \
              --repo "${REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
          echo "产物已上传至 ${release_url}"
