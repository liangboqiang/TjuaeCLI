name: 持续集成

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: 持续集成（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: 验证 Tjuae 身份标识
        shell: bash
        run: |
          if git grep -n -I -i -E '[a]ion|[i]officeai' -- . \
            ':(exclude)LICENSE' ':(exclude)UPSTREAM.md'; then
            echo "在法律归属文件之外发现旧身份标识。"
            exit 1
          fi
          if git ls-files | grep -E -i '[a]ion|[i]officeai'; then
            echo "在受 Git 跟踪的路径中发现旧身份标识。"
            exit 1
          fi

      - name: 设置 vx（从 vx.toml 安装 Rust 和 just）
        uses: loonghao/vx@v0.9.26
        with:
          setup: 'true'
          cache: 'true'

      - name: 安装 cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: 安装 cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: 检查格式
        run: vx just fmt-check

      - name: 运行 Clippy（警告视为错误）
        run: vx just lint

      - name: 运行测试（nextest CI profile）
        run: vx just test-ci

      - name: 安全审计
        run: vx cargo audit

      - name: 上传 nextest JUnit 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

  # ── 跨平台构建检查（仅编译，不运行）────────────────────────────────────
  # 验证工作区可针对每个发布目标完成编译。
  # 矩阵与 release.yml 保持一致，使 CI 能在回归进入发布工作流前发现编译问题。
  build:
    name: 构建（${{ matrix.target }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────────────────
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          # ── macOS ──────────────────────────────────────────────────────
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          # ── Windows ────────────────────────────────────────────────────
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: 设置 vx（从 vx.toml 安装 Rust）
        uses: loonghao/vx@v0.9.26
        with:
          setup: 'true'
          cache: 'true'

      - name: 添加交叉编译目标
        run: rustup target add ${{ matrix.target }}

      - name: 安装 cross（用于交叉编译目标）
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: 构建发布二进制文件
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }} -p tjuae-cli
          else
            vx cargo build --release --target ${{ matrix.target }} -p tjuae-cli
          fi

  # ── 使用测试结果标注 PR 或提交 ─────────────────────────────────────────
  report:
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: 下载 nextest JUnit 产物
        uses: actions/download-artifact@v8
        with:
          pattern: nextest-junit-*
          merge-multiple: true
          path: junit-reports

      - name: 发布测试报告
        uses: dorny/test-reporter@v3
        if: hashFiles('junit-reports/**/*.xml') != ''
        with:
          name: 单元测试与集成测试
          path: junit-reports/**/*.xml
          reporter: java-junit
          fail-on-error: true
